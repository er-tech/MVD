# Generated by smith from the workspace's projects. `smith add` and `smith ci generate`
# rewrite this file: put your own steps between the smith:slot markers, which are kept.
name: ci

run-name: ${{ inputs.release_bump != '' && format('ci · manual release {0}', inputs.release_bump) || github.event.pull_request.title || 'ci' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      assets_tag:
        description: "Run only the assets job again for this release tag (project@version), from this branch"
        required: false
        default: ""
      assets_source:
        description: "With assets_tag: the code to build. current = the code of this branch as it is now, named with the tag's version (a fix reaches the files, but they carry newer code under an old number). tag = the tag's own commit, the exact code that was released. ask me (refuses) = the run stops and names both choices; it is preselected so that nothing is built from code you did not pick"
        type: choice
        required: true
        default: "ask me (refuses)"
        options:
          - current
          - tag
          - "ask me (refuses)"
      release_bump:
        description: "Release by hand a package no commit releases, as project=patch|minor|major (several: separate with commas). This publishes to the registries, tags HEAD and cannot be undone. Empty: no manual release"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ inputs.assets_tag == '' }}
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache the go download store
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: smith-go-${{ runner.os }}-${{ hashFiles('apps/mvd/go.sum', 'libs/mvd-core/go.sum') }}
          restore-keys: |
            smith-go-${{ runner.os }}-
      - name: Cache the npm download store
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: smith-npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            smith-npm-${{ runner.os }}-
      - name: Install smith
        shell: bash
        run: |
          npm install --global --registry https://registry.npmjs.org/ monosmith@2.0.0-beta.28
          smith --version
      # smith:slot before-setup
      # smith:slot-end before-setup
      - name: Setup
        run: smith ci setup
        env:
          METIL_TOKEN: ${{ secrets.METIL_TOKEN }}
      - name: Audit
        run: smith ci audit
        env:
          METIL_TOKEN: ${{ secrets.METIL_TOKEN }}
      - name: Verify
        run: smith ci verify
        env:
          METIL_TOKEN: ${{ secrets.METIL_TOKEN }}
      # smith:slot after-verify
      # smith:slot-end after-verify
      - name: Release preview
        if: github.event_name == 'pull_request'
        run: smith release --dry-run --comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Pack
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_bump != '')) && github.ref_name == 'main'
        run: smith ci pack
        env:
          METIL_TOKEN: ${{ secrets.METIL_TOKEN }}
      - name: Keep the packed apps (dist/drop as artifact drop)
        uses: actions/upload-artifact@v7
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_bump != '')) && github.ref_name == 'main'
        with:
          name: drop
          path: dist/drop
          if-no-files-found: ignore
      - name: Release
        id: release
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_bump != '')) && github.ref_name == 'main'
        run: |
          if [ -n "$RELEASE_BUMP" ]; then
            smith ci release --bump "$RELEASE_BUMP" --force
          else
            smith ci release
          fi
        env:
          RELEASE_BUMP: ${{ inputs.release_bump }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METIL_TOKEN: ${{ secrets.METIL_TOKEN }}

  native:
    needs: ci
    if: ${{ always() && (needs.ci.result == 'success' || ((github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_bump != '')) && needs.ci.outputs.released == 'true')) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install smith
        shell: bash
        run: |
          npm install --global --registry https://registry.npmjs.org/ monosmith@2.0.0-beta.28
          smith --version
      - name: Setup
        run: smith ci setup
        env:
          METIL_TOKEN: ${{ secrets.METIL_TOKEN }}
      - name: Native
        run: smith ci native
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METIL_TOKEN: ${{ secrets.METIL_TOKEN }}
      - name: Keep the native builds (dist/drop as artifact native-OS)
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}
          path: dist/drop
          if-no-files-found: ignore

  assets:
    needs: ci
    if: ${{ always() && ((needs.ci.outputs.released == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_bump != '')) && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.assets_tag != '')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: macos-arm64
            os: macos-latest
          - platform: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          check-latest: true
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install smith
        shell: bash
        run: |
          npm install --global --registry https://registry.npmjs.org/ monosmith@2.0.0-beta.28
          smith --version
      - name: Install the Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Setup
        run: smith ci setup --assets
        env:
          METIL_TOKEN: ${{ secrets.METIL_TOKEN }}
      - name: Build and upload the release files
        run: smith ci assets --tag "$ASSETS_TAG" --source "$ASSETS_SOURCE"
        env:
          ASSETS_TAG: ${{ inputs.assets_tag }}
          ASSETS_SOURCE: ${{ inputs.assets_source }}
          SMITH_PLATFORM: ${{ matrix.platform }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METIL_TOKEN: ${{ secrets.METIL_TOKEN }}
